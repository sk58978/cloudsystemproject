<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <title>PolMarket – Profil</title>
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
    <header class="header">
        <div class="logo"><a href="index.html">Po<span>l</span>MARKET</a></div>
        <nav class="nav">
            <a href="index.html">Sklep</a>
            <a href="category.html">Kategorie</a>

        <div class="header-right">

    <main>
        <div class="auth-container">
            <h2>Mój profil</h2>

            <div style="display:flex; align-items:center; gap:12px; margin-top:14px;">
                <div id="profile-avatar" class="avatar"

                <div>
                    <div id="profile-name" style="font-weight:800;">—</div>
                    <div id="profile-email" style="color:#666; font-size:13px;">—</div>
                </div>
            </div>

            <hr style="margin:18px 0; border:none; border-top:1px solid #eee;">

            <button id="btn-logout" class="btn-primary" style="width:100%;">
                Wyloguj
            </button>

            <div id="profile-msg" style="margin-top:12px; font-size:13px;"></div>
        </div>
